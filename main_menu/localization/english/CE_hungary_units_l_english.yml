l_english:
 a_ce_royal_banderium: "Royal Banderium"
 a_ce_royal_banderium_desc: "Royal Banderia are elite companies drawn from nobles, exceptional mercenaries, and senior warriors of baronial retinues. Armed with heavy lances, plate armour, and armoured horses, they serve as fierce and loyal bodyguards to the Hungarian royal family, breaking enemy lines with concentrated wedge charges."
 a_ce_royal_banderium_3: "Reformed $a_ce_royal_banderium$"
 a_ce_royal_banderium_3_desc: "$a_ce_royal_banderium_desc$"
 a_ce_croat_axemen: "Croat Axemen"
 a_ce_croat_axemen_desc: "Croatian light infantry are renowned for their fierce axemen. These hardy warriors carry deadly two-handed axes and wear light armour, and their familiarity with rugged native terrain makes them particularly effective at breaking into archers and poorly equipped troops."
 a_ce_croat_axemen_2: "Late $a_ce_croat_axemen$"
 a_ce_croat_axemen_2_desc: "$a_ce_croat_axemen_desc$"
 a_ce_magyar_cavalry: "Magyar Cavalry"
 a_ce_magyar_cavalry_desc: "When the formerly nomadic Magyar people settled the Hungarian plains, some retained their life in the saddle. Armed with composite bows, light armour, and small swords, these natural horsemen excel at showering enemies with arrows while remaining beyond retaliation."
 a_ce_magyar_cavalry_2: "Late $a_ce_magyar_cavalry$"
 a_ce_magyar_cavalry_2_desc: "$a_ce_magyar_cavalry_desc$"
 a_ce_magyar_cavalry_3: "Reformed $a_ce_magyar_cavalry$"
 a_ce_magyar_cavalry_3_desc: "$a_ce_magyar_cavalry_desc$"
 a_ce_bosnian_archers: "Bosnian Archers"
 a_ce_bosnian_archers_desc: "The fractious nature of Bosnia gives its archers ample practice and makes them highly skilled with the self bow. Though lightly armoured, they carry distinctive large winged shields that offer protection while they weaken an approaching enemy."
 a_ce_bosnian_archers_2: "Late $a_ce_bosnian_archers$"
 a_ce_bosnian_archers_2_desc: "$a_ce_bosnian_archers_desc$"
 a_ce_peasant_archers: "Peasant Archers"
 a_ce_peasant_archers_desc: "Some peasants welcome the chance to earn pay and travel, while others are driven into service at sword point. Their small hunting bows are only moderately effective against lightly armoured enemies, and their knives offer scant protection if the fighting reaches them."
