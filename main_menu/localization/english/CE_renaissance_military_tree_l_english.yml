l_english:
 ce_medieval_military_production_advance: "Medieval Military Production"
 ce_medieval_military_production_advance_desc: "War is no longer sustained by isolated craftsmen working only to order. We will coordinate armorers, swordsmiths, gunsmiths, and founders through workshops able to produce arms in greater quantity and to more consistent standards. By securing their materials and organizing their labor, we can equip expanding armies and maintain the engines upon which modern warfare depends."
