 #Muslim Units
 a_ce_sudanese_javelinmen: "Sudanese Javelinmen"
 a_ce_sudanese_javelinmen_desc: "Good for weakening units and breaking up formations, but will quickly dissolve if caught in melee."
 a_ce_sudanese_javelinmen_2: "Late $a_ce_sudanese_javelinmen$"
 a_ce_sudanese_javelinmen_2_desc: "$a_ce_sudanese_javelinmen_desc$"
 a_ce_sudanese_javelinmen_3: "Reformed $a_ce_sudanese_javelinmen$"
 a_ce_sudanese_javelinmen_3_desc: "$a_ce_sudanese_javelinmen_desc$"
 a_ce_lamtuna_spearmen: "Lamtuna Spearmen"
 a_ce_lamtuna_spearmen_desc: "The Lamtuna are nomadic Saharan Berbers famed for their fierceness and discipline, whose warriors played an important part in the early Moorish conquest of Iberia. Armed with long spears and broad shields, they can hold a solid line against cavalry, but their light armour leaves them vulnerable to missile fire."
 a_ce_nubian_spearmen: "Nubian Spearmen"
 a_ce_nubian_spearmen_desc: "Nubian Spearmen are recruited from the lands south of the Sahara and trained into standing military formations throughout Egypt and the Maghreb. Brave and resilient, they carry short spears and broad shields but little armour, making them reliable flank guards against light cavalry but vulnerable in a prolonged melee."
 a_ce_nubian_spearmen_2: "Late $a_ce_nubian_spearmen$"
 a_ce_nubian_spearmen_2_desc: "$a_ce_nubian_spearmen_desc$"
 n_ce_baghlah: "Baghlah"
 n_ce_baghlah_desc: "First used in the thirteenth century, the Baghlah is a large Arabic ocean-going cargo vessel that can reach four hundred tonnes. Its capacity and long-range sailing qualities make it ideal for carrying troops and supplies between distant ports, while enterprising captains mount swivel guns along the hull to discourage pirates."
