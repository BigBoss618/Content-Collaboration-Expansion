l_english:

 a_ce_voulgier: "Voulgier"
 a_ce_voulgier_desc: "The voulge is a polearm descended from simple harvesting tools but fashioned for war, with a broad, slightly curved blade capable of delivering terrible wounds. Well equipped and trained to keep formation, French Voulgiers form solid heavy infantry whose armour-piercing weapons threaten both foot soldiers and mounted foes."
 a_ce_grand_bombard: "Grand Bombard"
 a_ce_grand_bombard_desc: "Developed during the early fifteenth century as a more powerful successor to the bombard, the Grand Bombard is an immense iron-forged siege piece. Its heavier shot, longer range, and improved accuracy allow it to inflict punishing damage upon walls, gates, and dense formations, while flaming ammunition brings ruin to enemy troops."
 a_ce_serpentine: "Serpentine"
 a_ce_serpentine_desc: "Named for the snake-like form of its long and slender barrel, the Serpentine is a relatively light cannon designed to engage troops rather than batter walls. Its narrow bore gives it excellent range and accuracy, while its smaller shot can be loaded and fired more quickly than the ammunition of heavier siege pieces."
