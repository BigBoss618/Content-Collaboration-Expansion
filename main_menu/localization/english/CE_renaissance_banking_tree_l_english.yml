l_english:
 ce_monetary_discipline_advance: "Monetary Discipline"
 ce_monetary_discipline_advance_desc: "Rulers in need of ready coin have long been tempted to debase the currency, but each reduction in weight and fineness erodes the confidence of merchants and subjects alike. We will enforce regular assays, restrain the mints, and withdraw the worst coin from circulation. A dependable currency will steady prices and preserve the value of the revenues gathered in our name."
 ce_double_entry_treasury_advance: "Double-Entry Treasury"
 ce_double_entry_treasury_advance_desc: "Merchant houses have learned to record each transaction twice, balancing what is owed against what is held. We will bring this discipline into the treasury, requiring clerks to reconcile receipts, arrears, and disbursements in ordered ledgers. With fewer sums lost to confusion or fraud, a greater share of the taxes assessed will reach our coffers."
 ce_frugal_administration_advance: "Frugal Administration"
 ce_frugal_administration_advance_desc: "Palaces, arsenals, granaries, and offices can consume a fortune when every steward purchases separately and no one accounts for waste. We will standardize contracts, inspect stores, and require officials to justify recurring expenses. Careful husbandry of public property will keep our establishments serviceable at less cost."
 ce_merchant_capital_advance: "Merchant Capital"
 ce_merchant_capital_advance_desc: "The fortunes accumulated in commerce need not lie idle in strongboxes or be spent only on display. Through partnerships, advances, and contracts, merchants can supply craftsmen with materials and workshops with the funds needed to expand. By directing private wealth toward productive enterprise, we will draw more value from the labor of our realm."
 ce_circulating_liquidity_advance: "Circulating Liquidity"
 ce_circulating_liquidity_advance_desc: "Coin locked in a chest enriches its owner only on paper; prosperity depends upon money passing from hand to hand. Deposits, bills of exchange, and trusted transfers allow merchants to settle obligations without waiting for every payment in specie. Keeping credit and currency in motion will sustain workshops, markets, and the prosperity of our towns."
