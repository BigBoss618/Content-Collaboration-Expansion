l_english:

 #Byzantine Units
 a_ce_archontopoulai: "Archontopoulai"
 a_ce_archontopoulai_desc: "Established by Emperor Alexios I near the end of the 11th century, the Archontopoulai, or 'sons of the leaders,' are drawn from the orphaned sons of officers who died in imperial service. Rigorous training turns them into disciplined elite cavalry, protected by quality heavy armour and equipped with shield, lance, and sword. Their cohesive charges can break enemy formations, while their courage and protection allow them to remain in sustained combat after the first impact."
 a_ce_byzantine_guard_archers: "Byzantine Guard Archers"
 a_ce_byzantine_guard_archers_desc: "Byzantine guard troops are financed by the Emperor himself and unlike many Byzantine units consist purely of Greek troops. Skilled in the use of the composite bow, these troops issue a challenge to all Byzantium's enemies at range. Also equipped with a sword and wearing mail, the Guard Archers can withstand more combat than many other missile units."
 a_ce_byzantine_lancers: "Byzantine Lancers"
 a_ce_byzantine_lancers_desc: "Byzantine Lancers are heavily equipped cavalry trained to deliver cohesive charges with long spears before regrouping behind the imperial line. Their superior initiative lets them strike early, while the weight of their assault disrupts enemy morale."
 a_ce_latinikon: "Latinikon"
 a_ce_latinikon_desc: "Latinikon is the collective term for western European troops in the Byzantine army. Despite fluctuating numbers, there are enough of them to warrant the position of Megas Konostablos being created to oversee them. With their heavy mail and lances, these warriors are highly valued, with the Emperor's daughter Anna Comnena commenting that they were able to charge through the walls of Babylon."
 a_ce_mangonel: "Mangonel"
 a_ce_mangonel_desc: "The Mangonel traces its ancestry to stone-throwing engines used in Roman times, though the medieval machine is built on a far larger scale. Its powerful arm can hurl heavy rocks against walls, gates, buildings, and tightly packed formations; specially prepared barrels of burning oil may instead burst over troops below. This destructive power comes at the price of a cumbersome siege train that moves slowly, consumes many supplies, and must be protected from enemy attack."
 a_ce_skythikon: "Skythikon"
 a_ce_skythikon_desc: "Skythikon is the Byzantine term used to describe the mainly Cuman, Asiatic Nomads, who serve the Byzantine Empire exclusively as horse archers. Accustomed to being on horseback in the plains and steppes of Eastern Europe and the Black Sea region, these cavalrymen wear little armour and are armed with a composite bow and a small sword."
 a_ce_trebizond_archers: "Trebizond Archers"
 a_ce_trebizond_archers_desc: "Hailing from the edge of the Black Sea and plying their trade in the service of Byzantium, these men are recruited from the peasantry but well trained in the use of the composite bow. They are effective against light infantry and when grouped in large numbers can become a thorn in the side of any opponent."
 a_ce_vardariotai: "Vardariotai"
 a_ce_vardariotai_desc: "The Vardariotai are recruited chiefly from the descendants of Magyar settlers in the Vardar valley. Disciplined and highly trained, these elite horse archers wear light mail or brigandine and loose powerful composite bows from fast ponies. Their speed lets them shower slower enemies with arrows and evade retaliation, although their lighter protection leaves them vulnerable if they are pinned in close combat."
