 n_ce_dromon: "Dromon"
 n_ce_dromon_desc: "A warship used by the Byzantine Empire since the 6th century, the Dromon is propelled by oar and sail and have a central tower from which marines can use their bow or throw spears and other projectiles."
 n_ce_lanternas: "Lanternas"
 n_ce_lanternas_desc: "The Lanternas is the premier version of the war galley, now equipped with gun powder weapons! Being larger, heavier, more durable and better equipped than the war galley, the Lanternas is used by naval commanders in the Mediterranean during the 15th century. Featuring multiple centreline guns and some flanking guns it can take on and destroy war galleys."
