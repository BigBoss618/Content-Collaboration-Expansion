l_english:

 a_ce_broken_lances: "Broken Lances"
 a_ce_broken_lances_desc: "In medieval Italy, a lance is not merely a weapon but a man-at-arms accompanied by lighter supporting troops. The lanze spezzate, or broken lances, are experienced men-at-arms separated from those retinues and hired independently. Disciplined professionals, they fight as heavy cavalry with lance and sword while relying upon the finest Italian plate armour for protection."
 a_ce_broken_lances_2: "Late $a_ce_broken_lances$"
 a_ce_broken_lances_2_desc: "$a_ce_broken_lances_desc$"
 a_ce_milanese_cavalry_militia: "Milanese Cavalry Militia"
 a_ce_milanese_cavalry_militia_desc: "The prosperous cities of northern Italy can call upon citizens wealthy enough to equip themselves as heavy cavalry. Clad in mail and carrying lances, swords, and shields, these part-time horsemen are formidable against other militia, although they cannot equal warriors trained for battle from childhood."
 a_ce_milanese_cavalry_militia_2: "Late $a_ce_milanese_cavalry_militia$"
 a_ce_milanese_cavalry_militia_2_desc: "$a_ce_milanese_cavalry_militia_desc$"
 a_ce_famiglia_ducale: "Famiglia Ducale"
 a_ce_famiglia_ducale_desc: "The Famiglia Ducale comprises the Duke's own family and household retinue, drawn from the Lombard nobility. Equipped with plate armour, armoured horses, heavy lances, and swords, these practiced warriors form an elite bodyguard, defending their lord's person, honour, and interests with uncompromising resolve."
 a_ce_famiglia_ducale_2: "Renaissance $a_ce_famiglia_ducale$"
 a_ce_famiglia_ducale_2_desc: "$a_ce_famiglia_ducale_desc$"
 a_ce_famiglia_ducale_3: "Late $a_ce_famiglia_ducale$"
 a_ce_famiglia_ducale_3_desc: "$a_ce_famiglia_ducale_desc$"
 a_ce_dismounted_broken_lances: "Dismounted Broken Lances"
 a_ce_dismounted_broken_lances_desc: "In medieval Italy, each lance comprises a man-at-arms and the lighter retainers who support him. The lanze spezzate, or broken lances, are experienced men-at-arms detached from those retinues and hired separately. Disciplined professionals who fight as readily on foot as on horseback, they close ranks behind stout shields, fine Italian plate armour, and keen swords."
 a_ce_dismounted_broken_lances_2: "Late $a_ce_dismounted_broken_lances$"
 a_ce_dismounted_broken_lances_2_desc: "$a_ce_dismounted_broken_lances_desc$"
 a_ce_dismounted_broken_lances_3: "Veteran $a_ce_dismounted_broken_lances$"
 a_ce_dismounted_broken_lances_3_desc: "$a_ce_dismounted_broken_lances_desc$"
