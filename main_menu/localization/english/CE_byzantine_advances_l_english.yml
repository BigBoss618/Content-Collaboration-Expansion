l_english:

 #Greek Unique
 ce_archontopoulai_advance: "$a_ce_archontopoulai$"
 ce_archontopoulai_advance_desc: "We will honour the orphaned sons of fallen imperial officers by training them for service in an elite mounted corps. Equipped with heavy armour, shields, lances, and swords, they will learn to charge as one and retain their discipline once battle becomes a grinding melee. This institution gives us access to the Archontopoulai, resolute shock cavalry whose courage is matched by their staying power."
 ce_byzantine_guard_archers_advance: "$a_ce_byzantine_guard_archers$"
 ce_byzantine_guard_archers_advance_desc: "Our emperors will finance a permanent corps of Greek archers equipped with composite bows, swords, and mail. We will train them to punish enemies at range while retaining the discipline and protection needed to survive close combat. This guard gives us access to Byzantine Guard Archers, resilient missile troops capable of inflicting and enduring greater harm."
 ce_byzantine_lancers_advance: "$BYZ_ADJ$ Lancers"
 ce_byzantine_lancers_advance_desc: "Well trained and well disciplined, Byzantine Lancers are well armoured and equipped with a lance and a sword. Common throughout the Byzantine Empire, their training and discipline makes them very useful on the battlefield."
 ce_latinikon_advance: "Latinikon"
 ce_latinikon_advance_desc: "Our emperors have long relied on western European warriors whose heavy mail and couched lances lend formidable weight to an imperial charge. We will gather these Latin troops under the authority of the Megas Konostablos and give their contingents a permanent place in our armies. This organization gives us access to the Latinikon, whose disciplined charges inflict exceptional damage upon our enemies."
 ce_mangonel_advance: "$a_ce_mangonel$"
 ce_mangonel_advance_desc: "We will revive and enlarge the stone-throwing engines known since Roman times. Skilled carpenters and artificers can build powerful machines capable of smashing fortifications or scattering dense formations with rocks and burning vessels. This work gives us access to the Mangonel, formidable siege artillery whose destructive power must be balanced against its slow and demanding baggage train."
 ce_skythikon_advance: "Skythikon"
 ce_skythikon_advance_desc: "Our armies have long recruited Cuman and other Asiatic nomads from the plains surrounding the Black Sea. We will formalize these horse-archer contingents as the #italic Skythikon#! and preserve their distinct methods of mounted warfare. This arrangement gives us swift light cavalry whose mobility and composite bows can harass and outflank heavier enemies."
 ce_trebizond_archers_advance: "$a_ce_trebizond_archers$"
 ce_trebizond_archers_advance_desc: "Our armies can draw skilled bowmen from the Pontic Greek peasantry along the Black Sea coast. We will organize these men into disciplined formations whose composite bows can trouble enemy light troops and mass their volleys against larger formations. This recruitment gives us access to Trebizond Archers wherever their culture dominates the local population."
 ce_vardariotai_advance: "$a_ce_vardariotai$"
 ce_vardariotai_advance_desc: "We will recruit the descendants of Magyar settlers in the Vardar valley into a disciplined corps of mounted archers. Light mail, fast ponies, and powerful composite bows will let them maintain a relentless skirmish while refusing combat on an enemy's terms. This organization gives us access to the Vardariotai, swift and steadfast horse archers who excel at harassment and pursuit."
 ce_archontopoulai_2_advance: "$a_ce_archontopoulai_2$"
 ce_archontopoulai_2_advance_desc: "$ce_archontopoulai_advance_desc$"
 ce_byzantine_guard_archers_2_advance: "$a_ce_byzantine_guard_archers_2$"
 ce_byzantine_guard_archers_2_advance_desc: "$ce_byzantine_guard_archers_advance_desc$"
 ce_byzantine_lancers_2_advance: "$a_ce_byzantine_lancers_2$"
 ce_byzantine_lancers_2_advance_desc: "$ce_byzantine_lancers_advance_desc$"
 ce_dromon_advance: "$n_ce_dromon$"
 ce_dromon_advance_desc: "We will preserve the Dromon as the foundation of our early war fleet. We can combine oars and sail with a raised fighting platform, giving embarked marines room to operate while the vessel retains the qualities of a traditional galley. Its economical construction and upkeep will let us field enough ships to protect transports, hunt weaker fleets, maintain blockades, and project our presence across nearby seas."
 ce_latinikon_2_advance: "$a_ce_latinikon_2$"
 ce_latinikon_2_advance_desc: "$ce_latinikon_advance_desc$"
 ce_mangonel_2_advance: "$a_ce_mangonel_2$"
 ce_mangonel_2_advance_desc: "$ce_mangonel_advance_desc$"
 ce_skythikon_2_advance: "$a_ce_skythikon_2$"
 ce_skythikon_2_advance_desc: "$ce_skythikon_advance_desc$"
 ce_trebizond_archers_2_advance: "$a_ce_trebizond_archers_2$"
 ce_trebizond_archers_2_advance_desc: "$ce_trebizond_archers_advance_desc$"
 ce_vardariotai_2_advance: "$a_ce_vardariotai_2$"
 ce_vardariotai_2_advance_desc: "$ce_vardariotai_advance_desc$"
 ce_byzantine_lancers_3_advance: "$a_ce_byzantine_lancers_3$"
 ce_byzantine_lancers_3_advance_desc: "$ce_byzantine_lancers_advance_desc$"
 ce_lanternas_advance: "$n_ce_lanternas$"
 ce_lanternas_advance_desc: "We will adapt the long-oared Mediterranean war galley to the growing power of naval gunpowder. By mounting multiple centreline guns and lighter flanking pieces upon a swift galley hull, we can create a vessel capable of defeating ordinary war galleys in direct combat. This development gives us access to the Lanternas, the premier gun galley of our fleet."
 ce_latinikon_3_advance: "$a_ce_latinikon_3$"
 ce_latinikon_3_advance_desc: "$ce_latinikon_advance_desc$"
