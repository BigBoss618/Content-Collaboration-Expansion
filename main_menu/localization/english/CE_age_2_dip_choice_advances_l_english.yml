l_english:
 ce_hawkish_negotiations: "Hawkish Negotiations"
 ce_hawkish_negotiations_desc: "Conciliation alone cannot bind every subject firmly to our realm. We will pair our envoys' promises with unmistakable displays of military resolve, leaving hesitant rulers little doubt about the cost of delay. By pressing negotiations from a position of strength, we shall bring their lands and institutions under our authority more swiftly."
